kind = "web"
previewPath = "/"
title = "OHLC Image Pattern Analysis"
description = "A Python-powered market-pattern workbench that turns OHLC data into comparable images, clusters similar chart patterns, finds visual matches for new data, and returns structured JSON."
version = "1.0.0"
id = "artifacts/ohlc-pattern-lab"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20670

[services.development]
run = "pnpm --filter @workspace/ohlc-pattern-lab run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ohlc-pattern-lab", "run", "build" ]
serve = "static"
publicDir = "artifacts/ohlc-pattern-lab/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20670"
BASE_PATH = "/"
