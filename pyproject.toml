[project]
name = "nifty-trajectory"
version = "0.1.0"
description = "Python API and CLI for the NIFTY intraday trajectory pattern engine"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.142.4",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.1.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
nifty = "nifty_api.__main__:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.13.1",
    "pytest>=8.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nifty_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
